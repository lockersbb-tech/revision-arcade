var storageOK = true;
var state = { xp:0, streak:0, lastActive:null, progress:{} };

function initProgress(){
  SUBJECTS.forEach(function(s){
    if(!state.progress[s.id]) state.progress[s.id] = { xp:0, best:0, attempts:0 };
  });
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function loadState(cb){
  try {
    var raw = localStorage.getItem('arcade-state');
    if(raw){
      var parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  } catch(e){ storageOK = false; }
  initProgress();
  checkStreak();
  cb();
}

function saveState(){
  if(!storageOK) return;
  try { localStorage.setItem('arcade-state', JSON.stringify(state)); }
  catch(e){ storageOK = false; }
}

function checkStreak(){
  var today = todayStr();
  if(state.lastActive === today) return;
  if(state.lastActive){
    var last = new Date(state.lastActive);
    var now = new Date(today);
    var diffDays = Math.round((now - last) / 86400000);
    if(diffDays > 1) state.streak = 0;
  }
}

function markActiveToday(){
  var today = todayStr();
  if(state.lastActive !== today){
    var wasYesterday = false;
    if(state.lastActive){
      var last = new Date(state.lastActive);
      var now = new Date(today);
      wasYesterday = Math.round((now - last) / 86400000) === 1;
    }
    state.streak = state.lastActive ? (wasYesterday ? state.streak + 1 : 1) : 1;
    state.lastActive = today;
  }
}

function updateHeader(){
  document.getElementById('ar-streak-num').textContent = state.streak;
  document.getElementById('ar-xp-num').textContent = state.xp;
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function levelFor(xp){
  return Math.floor(xp / 50) + 1;
}

function renderHome(){
  var el = document.getElementById('ar-screen');
  var html = '<div class="ar-fade">';
  html += '<div style="font-family:\'Fredoka\',sans-serif; font-size:15px; color:#B8B4CC; margin-bottom:14px;">Pick a subject to start a 10-question run</div>';
  html += '<div style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px;">';
  SUBJECTS.forEach(function(s){
    var p = state.progress[s.id];
    var lvl = levelFor(p.xp);
    var pct = Math.min(100, Math.round(((p.xp % 50) / 50) * 100));
    html += '<button class="ar-btn" data-subj="'+s.id+'" style="text-align:left; background:'+s.dark+'; border:1px solid '+s.color+'44; border-radius:16px; padding:14px; color:#F1EFE8;">';
    html += '<div style="font-weight:600; font-size:14px; font-family:\'Fredoka\',sans-serif; color:'+s.color+';">'+s.name+'</div>';
    html += '<div style="font-size:11px; color:#9C97B4; margin:2px 0 10px;">'+s.sub+'</div>';
    html += '<div style="font-size:11px; color:#B8B4CC; margin-bottom:4px;">Level '+lvl+'</div>';
    html += '<div style="height:6px; background:#00000033; border-radius:4px; overflow:hidden;"><div style="height:100%; width:'+pct+'%; background:'+s.color+';"></div></div>';
    html += '</button>';
  });
  html += '</div></div>';
  el.innerHTML = html;
  Array.prototype.forEach.call(el.querySelectorAll('[data-subj]'), function(btn){
    btn.addEventListener('click', function(){ startSession(btn.getAttribute('data-subj')); });
  });
}

var session = null;

function startSession(subjId){
  var subj = SUBJECTS.filter(function(s){ return s.id === subjId; })[0];
  var pool = shuffle(BANK[subjId] || []);
  var qs = pool.slice(0, Math.min(10, pool.length));
  session = { subj:subj, questions:qs, idx:0, correct:0, locked:false };
  renderQuestion();
}

function renderQuestion(){
  var el = document.getElementById('ar-screen');
  var s = session;
  if(s.idx >= s.questions.length){ renderSummary(); return; }
  var q = s.questions[s.idx];
  var subj = s.subj;
  var html = '<div class="ar-fade">';
  html += '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">';
  html += '<button class="ar-btn" id="ar-exit" style="background:none; color:#9C97B4; font-size:13px; padding:4px 0;">&larr; Exit</button>';
  html += '<div style="font-size:12px; color:#9C97B4;">Question '+(s.idx+1)+' of '+s.questions.length+'</div>';
  html += '</div>';
  html += '<div style="display:flex; gap:4px; margin-bottom:20px;">';
  s.questions.forEach(function(_,i){
    var col = i < s.idx ? subj.color : (i === s.idx ? '#FFFFFF33' : '#241F3B');
    html += '<div style="flex:1; height:5px; border-radius:3px; background:'+col+';"></div>';
  });
  html += '</div>';
  html += '<div style="background:'+subj.dark+'; border-radius:18px; padding:20px; margin-bottom:16px;">';
  html += '<div style="font-size:11px; color:'+subj.color+'; font-weight:600; margin-bottom:8px;">'+subj.name+'</div>';
  html += '<div style="font-size:17px; font-family:\'Fredoka\',sans-serif; font-weight:500; line-height:1.4;">'+q.q+'</div>';
  html += '</div>';
  html += '<div id="ar-options" style="display:flex; flex-direction:column; gap:10px;">';
  q.o.forEach(function(opt, i){
    html += '<button class="ar-btn ar-opt" data-i="'+i+'" style="text-align:left; background:#1F1B33; border:1.5px solid #2E2A45; border-radius:12px; padding:14px 16px; color:#F1EFE8; font-size:14px;">'+opt+'</button>';
  });
  html += '</div>';
  html += '<div id="ar-feedback" style="margin-top:14px; font-size:13px; min-height:18px;"></div>';
  html += '</div>';
  el.innerHTML = html;
  document.getElementById('ar-exit').addEventListener('click', function(){ session=null; renderHome(); });
  Array.prototype.forEach.call(el.querySelectorAll('.ar-opt'), function(btn){
    btn.addEventListener('click', function(){ selectAnswer(parseInt(btn.getAttribute('data-i'),10)); });
  });
}

function selectAnswer(i){
  var s = session;
  if(s.locked) return;
  s.locked = true;
  var q = s.questions[s.idx];
  var buttons = document.querySelectorAll('.ar-opt');
  var correct = i === q.c;
  if(correct) s.correct++;
  Array.prototype.forEach.call(buttons, function(btn, idx){
    btn.style.pointerEvents = 'none';
    if(idx === q.c){
      btn.style.background = '#1D4A2F';
      btn.style.borderColor = '#34D399';
    } else if(idx === i && !correct){
      btn.style.background = '#4A1B1B';
      btn.style.borderColor = '#E85D75';
      btn.classList.add('ar-pop');
    }
  });
  var fb = document.getElementById('ar-feedback');
  fb.style.color = correct ? '#34D399' : '#F5A3A3';
  fb.textContent = correct ? 'Correct — nice one.' : 'Not quite. The right answer is highlighted.';
  if(correct){
    state.xp += 10;
    state.progress[s.subj.id].xp += 10;
    updateHeader();
    saveState();
  }
  setTimeout(function(){
    s.idx++;
    renderQuestion();
  }, 1100);
}

function renderSummary(){
  var s = session;
  var subj = s.subj;
  var p = state.progress[subj.id];
  p.attempts++;
  if(s.correct > p.best) p.best = s.correct;
  markActiveToday();
  saveState();
  updateHeader();
  var el = document.getElementById('ar-screen');
  var pct = Math.round((s.correct / s.questions.length) * 100);
  var msg = pct === 100 ? 'Perfect run.' : pct >= 70 ? 'Solid session.' : 'Good effort — worth another go.';
  var html = '<div class="ar-fade" style="text-align:center; padding:20px 0;">';
  html += '<div style="font-size:13px; color:'+subj.color+'; font-weight:600; margin-bottom:6px;">'+subj.name+'</div>';
  html += '<div style="font-family:\'Fredoka\',sans-serif; font-size:24px; font-weight:600; margin-bottom:4px;">'+msg+'</div>';
  html += '<div style="font-size:14px; color:#B8B4CC; margin-bottom:24px;">'+s.correct+' / '+s.questions.length+' correct &middot; +'+(s.correct*10)+' XP</div>';
  html += '<div style="display:flex; justify-content:center; gap:24px; margin-bottom:28px;">';
  html += '<div><div style="font-size:20px; font-weight:600; color:#FFB627;">'+state.xp+'</div><div style="font-size:11px; color:#9C97B4;">total XP</div></div>';
  html += '<div><div style="font-size:20px; font-weight:600; color:#FF7A59;">'+state.streak+'</div><div style="font-size:11px; color:#9C97B4;">day streak</div></div>';
  html += '<div><div style="font-size:20px; font-weight:600;">'+p.best+'</div><div style="font-size:11px; color:#9C97B4;">best run</div></div>';
  html += '</div>';
  html += '<button class="ar-btn" id="ar-again" style="background:'+subj.color+'; color:#14121F; font-weight:600; border-radius:14px; padding:13px 24px; font-size:14px; margin-right:10px;">Go again</button>';
  html += '<button class="ar-btn" id="ar-home" style="background:none; border:1.5px solid #2E2A45; color:#F1EFE8; border-radius:14px; padding:13px 24px; font-size:14px;">Subjects</button>';
  html += '</div>';
  el.innerHTML = html;
  document.getElementById('ar-again').addEventListener('click', function(){ startSession(subj.id); });
  document.getElementById('ar-home').addEventListener('click', function(){ session=null; renderHome(); });
}

loadState(function(){
  updateHeader();
  renderHome();
});

})();
</script>
